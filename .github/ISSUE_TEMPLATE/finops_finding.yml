name: FinOps finding
description: Propose a sanitized product/accounting finding, not a customer assessment data store
title: "[FinOps]: "
labels:
  - finops-finding
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Use this form for sanitized product/accounting improvement proposals.
        Customer Assessment findings and datasets remain in the customer's approved environment, not GitHub issues.
        Do not include credentials, account identifiers, customer records, prompts, exports, or confidential provider data.
        Forecasting, optimization, and billing capabilities are not implemented merely because this form exists.
  - type: input
    id: finding_title
    attributes:
      label: Finding title
      placeholder: Short descriptive title
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Integration
      options:
        - Microsoft Foundry
        - Amazon Bedrock
        - Google Vertex AI
        - Multiple required providers
        - Provider-independent
    validations:
      required: true
  - type: dropdown
    id: observation_source
    attributes:
      label: Observation source
      options:
        - Documentation or design review
        - Application request usage
        - Provider telemetry aggregate
        - Billing data (scope must be approved)
        - Sanitized test fixture
        - Unknown or other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Finding and impact
      description: Distinguish an observed defect from a proposed feature or unresolved design decision.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence and measurement limits
      description: State source, grain, time window, freshness, coverage, and whether data is reported, estimated, or test-only.
      placeholder: Link repository code/docs or public provider references; exclude customer identifiers and payloads.
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: Link relevant REQ IDs, risk, or ADR; explain reconciliation and double-counting implications.
    validations:
      required: true
  - type: textarea
    id: cost_basis
    attributes:
      label: Optional cost impact and assumptions
      description: State currency, period, rate source/effective date, and estimated versus reported charges. No repository-wide reporting currency is assumed.
  - type: textarea
    id: verification
    attributes:
      label: Verification and next step
      description: Define acceptance criteria, negative cases, responsible role, and checks still needed.
