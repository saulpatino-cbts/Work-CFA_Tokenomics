name: Bug report
description: Report a reproducible non-sensitive product, documentation, or tooling problem
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Read .github/SECURITY.md before reporting a vulnerability.
        Do not post exploit details, credentials, customer content/exports, prompts, private URLs, or identifying provider data.
        This repository is at documentation/architecture foundation stage; planned capabilities are not implemented features.
  - type: checkboxes
    id: duplicate_check
    attributes:
      label: Duplicate check
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
  - type: input
    id: summary
    attributes:
      label: Bug summary
      placeholder: Short description of the actual problem
    validations:
      required: true
  - type: dropdown
    id: affected_area
    attributes:
      label: Affected area
      options:
        - Documentation or repository tooling
        - Deployment or upgrade
        - Setup or user interface
        - Identity or role behavior (non-sensitive report only)
        - Assessment (non-sensitive report only)
        - Foundry connector
        - Bedrock connector
        - Vertex AI connector
        - Usage normalization or reconciliation
        - Export or import
        - Customer data lifecycle
        - Other
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: State actual behavior, not an assumption that a planned feature exists.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: What should have happened?
      description: Link an applicable requirement, contract, or existing behavior.
    validations:
      required: true
  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Safe reproduction
      description: Use a sanitized test environment. Do not disclose a vulnerability here.
      placeholder: |
        1. Start from this commit/version ...
        2. Configure non-sensitive test inputs ...
        3. Run or click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and version
      description: Include only necessary non-sensitive details; omit real account IDs and private endpoints.
      placeholder: Commit/tag, runtime/browser, configured adapter/API version, and relevant safe settings
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      description: Exclude tokens, credentials, provider payloads, and customer content.
      render: shell
  - type: textarea
    id: impact
    attributes:
      label: Impact and workaround
      description: Explain affected behavior and any safe workaround without disclosing private information.
  - type: textarea
    id: verification
    attributes:
      label: Suggested regression check
      description: Describe observable acceptance criteria and checks not yet run.
