[project]
name = "cfa-tokenomics-api"
version = "0.0.0"
description = "Work-CFA_Tokenomics API skeleton (proposed ADR 0004; not a product release)."
requires-python = ">=3.12"
dependencies = [
  "azure-identity==1.27.0",
  "azure-storage-blob==12.31.1",
  "boto3==1.44.0",
  "cryptography==50.0.2",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.8",
  "PyJWT==2.15.1",
  "alembic==1.20.1",
  "SQLAlchemy==2.1.8",
  "pydantic-settings==2.16.2",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfa_tokenomics = ["migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Formula lines mirror the equations in docs/economics/05-calculation-engine.md.
"src/cfa_tokenomics/econ/*" = ["E501"]
"src/cfa_tokenomics/focus/*" = ["E501"]
"src/cfa_tokenomics/alloc/*" = ["E501"]
"src/cfa_tokenomics/connectors/*" = ["E501"]
"src/cfa_tokenomics/samples/*" = ["E501"]
"tests/test_connectors_*.py" = ["E501"]
"tests/test_samples.py" = ["E501"]
"tests/test_econ.py" = ["E501"]
"tests/test_tenancy.py" = ["E501"]
"tests/test_focus_*.py" = ["E501"]
"tests/test_economics_api.py" = ["E501"]
"tests/test_alloc_*.py" = ["E501"]
# Declarative table definitions read best one constraint per line.
"src/cfa_tokenomics/migrations/versions/000[5-9]_*" = ["E501"]
"src/cfa_tokenomics/legacy_tenancy.py" = ["E501"]
"src/cfa_tokenomics/usage/facts.py" = ["E501"]
"tests/test_legacy_*.py" = ["E501"]
"tests/test_usage_facts.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
